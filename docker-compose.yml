services:
  frontend:
    build:
      context: 
          ./frontend
    ports:
      - "3001:80"
    depends_on:
      - api
  api:
    build:
      context: 
          ./backend
    ports:
      - "5000:5000"
    environment:
       DB_HOST: db
       DB_PORT: 5432
       DB_NAME: taskdb
       DB_USER: appuser
       DB_PASSWORD: localdev123
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


  db:
    build:
      context: ./db
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: localdev123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: